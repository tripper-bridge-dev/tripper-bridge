plugins {
    id 'com.android.application'
}

android {
    namespace 'com.tripperbridge'
    compileSdk 34

    defaultConfig {
        applicationId "com.tripperbridge"
        minSdk 26
        targetSdk 34
        versionCode 8
        versionName "0.8"
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    lint {
        abortOnError false
    }

    buildTypes {
        release {
            minifyEnabled false
        }
    }
}
